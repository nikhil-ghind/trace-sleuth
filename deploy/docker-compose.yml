version: "3.9"

services:
  # --- Infrastructure ---
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../monitoring/grafana:/var/lib/grafana/dashboards

  # --- Application Services ---
  catalog:
    build:
      context: ../services/catalog
    ports:
      - "8001:8001"
    depends_on:
      - jaeger
    environment:
      SERVICE_PORT: "8001"
      JAEGER_ENDPOINT: "http://jaeger:4317"

  orders:
    build:
      context: ../services/orders
    ports:
      - "8002:8002"
    depends_on:
      - jaeger
      - kafka
      - catalog
    environment:
      SERVICE_PORT: "8002"
      JAEGER_ENDPOINT: "http://jaeger:4317"
      CATALOG_SERVICE_URL: "http://catalog:8001"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  checkout:
    build:
      context: ../services/checkout
    ports:
      - "8003:8003"
    depends_on:
      - jaeger
      - catalog
      - orders
    environment:
      SERVICE_PORT: "8003"
      JAEGER_ENDPOINT: "http://jaeger:4317"
      CATALOG_SERVICE_URL: "http://catalog:8001"
      ORDERS_SERVICE_URL: "http://orders:8002"

  ai-debugger:
    build:
      context: ../ai_debugger
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    depends_on:
      - jaeger
      - prometheus
    environment:
      JAEGER_API_URL: "http://jaeger:16686"
      PROMETHEUS_API_URL: "http://prometheus:9090"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
